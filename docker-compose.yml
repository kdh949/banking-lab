services:
  banking-lab:
    build:
      context: .
      dockerfile: infra/docker-compose/Dockerfile
    environment:
      NODE_ENV: development
      PORT: "8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
  postgres:
    image: postgres:16-alpine
    profiles:
      - migration
      - platform
    environment:
      POSTGRES_DB: banking_lab
      POSTGRES_USER: banking_lab
      POSTGRES_PASSWORD: banking_lab
    ports:
      - "${BANKING_LAB_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking_lab -d banking_lab"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
  core-banking:
    build:
      context: .
      dockerfile: infra/docker-compose/core-banking.Dockerfile
    profiles:
      - migration
      - platform
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banking_lab
      SPRING_DATASOURCE_USERNAME: banking_lab
      SPRING_DATASOURCE_PASSWORD: banking_lab
      BANKING_LAB_SYNTHETIC_ONLY: "true"
      BANKING_LAB_SECURITY_ENABLED: "${BANKING_LAB_SECURITY_ENABLED:-true}"
      BANKING_LAB_SECURITY_SIMULATOR_TOKENS_ENABLED: "${BANKING_LAB_SECURITY_SIMULATOR_TOKENS_ENABLED:-false}"
      BANKING_LAB_DEV_SIMULATOR_TOKEN: "${BANKING_LAB_DEV_SIMULATOR_TOKEN:-false}"
      BANKING_LAB_CUSTOMER_AUTH_SYNTHETIC_TOKEN_ISSUER_ENABLED: "${BANKING_LAB_CUSTOMER_AUTH_SYNTHETIC_TOKEN_ISSUER_ENABLED:-false}"
      BANKING_LAB_SECURITY_JWKS_URI: "${BANKING_LAB_SECURITY_JWKS_URI:-http://keycloak:8080/realms/banking-lab/protocol/openid-connect/certs}"
      BANKING_LAB_SECURITY_ISSUER: "${BANKING_LAB_SECURITY_ISSUER:-http://localhost:${BANKING_LAB_KEYCLOAK_PORT:-8085}/realms/banking-lab}"
      BANKING_LAB_SECURITY_AUDIENCE: "${BANKING_LAB_SECURITY_AUDIENCE:-core-banking-api}"
      BANKING_LAB_SECURITY_TRUSTED_DEVICE_ENFORCEMENT_ENABLED: "${BANKING_LAB_SECURITY_TRUSTED_DEVICE_ENFORCEMENT_ENABLED:-true}"
      BANKING_LAB_SECURITY_STEP_UP_ENFORCEMENT_ENABLED: "${BANKING_LAB_SECURITY_STEP_UP_ENFORCEMENT_ENABLED:-true}"
      BANKING_LAB_SECURITY_SESSION_ENFORCEMENT_ENABLED: "${BANKING_LAB_SECURITY_SESSION_ENFORCEMENT_ENABLED:-true}"
      BANKING_LAB_SYNTHETIC_SEED_ENABLED: "${BANKING_LAB_SYNTHETIC_SEED_ENABLED:-false}"
      BANKING_LAB_CUSTOMER_TRANSFER_FAULT_CRASH_AFTER_COMMIT_IDEMPOTENCY_KEY: "${BANKING_LAB_CUSTOMER_TRANSFER_FAULT_CRASH_AFTER_COMMIT_IDEMPOTENCY_KEY:-}"
      BANKING_LAB_CUSTOMER_TRANSFER_FAULT_CRASH_AFTER_COMMIT_EXIT_CODE: "${BANKING_LAB_CUSTOMER_TRANSFER_FAULT_CRASH_AFTER_COMMIT_EXIT_CODE:-89}"
      BANKING_LAB_CORS_ALLOWED_ORIGINS: "${BANKING_LAB_CORS_ALLOWED_ORIGINS:-http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:3005,http://localhost:3006,http://localhost:3007}"
      BANKING_LAB_TEMPORAL_TARGET: temporal:7233
      BANKING_LAB_TEMPORAL_WORKER_ENABLED: "false"
      BANKING_LAB_TRACING_ENABLED: "${BANKING_LAB_TRACING_ENABLED:-true}"
      BANKING_LAB_OTLP_TRACING_EXPORT_ENABLED: "${BANKING_LAB_OTLP_TRACING_EXPORT_ENABLED:-true}"
      BANKING_LAB_OTLP_TRACES_ENDPOINT: "${BANKING_LAB_OTLP_TRACES_ENDPOINT:-http://tempo:4318/v1/traces}"
      BANKING_LAB_OTEL_SERVICE_NAME: banking-lab-core-banking
    ports:
      - "${BANKING_LAB_CORE_BANKING_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
  core-banking-temporal-worker:
    build:
      context: .
      dockerfile: infra/docker-compose/core-banking.Dockerfile
    profiles:
      - platform
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banking_lab
      SPRING_DATASOURCE_USERNAME: banking_lab
      SPRING_DATASOURCE_PASSWORD: banking_lab
      BANKING_LAB_SYNTHETIC_ONLY: "true"
      BANKING_LAB_TEMPORAL_TARGET: temporal:7233
      BANKING_LAB_TEMPORAL_TASK_QUEUE: "${BANKING_LAB_TEMPORAL_TASK_QUEUE:-banking-case-workflows}"
      BANKING_LAB_TEMPORAL_WORKER_ENABLED: "true"
      BANKING_LAB_TRACING_ENABLED: "${BANKING_LAB_TRACING_ENABLED:-true}"
      BANKING_LAB_OTLP_TRACING_EXPORT_ENABLED: "${BANKING_LAB_OTLP_TRACING_EXPORT_ENABLED:-true}"
      BANKING_LAB_OTLP_TRACES_ENDPOINT: "${BANKING_LAB_OTLP_TRACES_ENDPOINT:-http://tempo:4318/v1/traces}"
      BANKING_LAB_OTEL_SERVICE_NAME: banking-lab-core-banking-temporal-worker
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
  core-banking-outbox-worker:
    build:
      context: .
      dockerfile: infra/docker-compose/core-banking.Dockerfile
    profiles:
      - platform
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banking_lab
      SPRING_DATASOURCE_USERNAME: banking_lab
      SPRING_DATASOURCE_PASSWORD: banking_lab
      BANKING_LAB_SYNTHETIC_ONLY: "true"
      BANKING_LAB_TEMPORAL_WORKER_ENABLED: "false"
      BANKING_LAB_OUTBOX_BOOTSTRAP_SERVERS: redpanda:9092
      BANKING_LAB_OUTBOX_TOPIC: "${BANKING_LAB_OUTBOX_TOPIC:-banking.lab.domain-events}"
      BANKING_LAB_OUTBOX_WORKER_ENABLED: "true"
      BANKING_LAB_OUTBOX_WORKER_CLIENT_ID: "${BANKING_LAB_OUTBOX_WORKER_CLIENT_ID:-core-banking-outbox-worker}"
      BANKING_LAB_OUTBOX_WORKER_BATCH_SIZE: "${BANKING_LAB_OUTBOX_WORKER_BATCH_SIZE:-100}"
      BANKING_LAB_OUTBOX_WORKER_POLL_INTERVAL_MILLIS: "${BANKING_LAB_OUTBOX_WORKER_POLL_INTERVAL_MILLIS:-1000}"
      BANKING_LAB_OUTBOX_PUBLISH_TIMEOUT_MILLIS: "${BANKING_LAB_OUTBOX_PUBLISH_TIMEOUT_MILLIS:-5000}"
      BANKING_LAB_OUTBOX_DEAD_LETTER_THRESHOLD: "${BANKING_LAB_OUTBOX_DEAD_LETTER_THRESHOLD:-3}"
      BANKING_LAB_OUTBOX_RETRY_DELAY_SECONDS: "${BANKING_LAB_OUTBOX_RETRY_DELAY_SECONDS:-60}"
      BANKING_LAB_OUTBOX_FAULT_CRASH_AFTER_ACK_EVENT_ID: "${BANKING_LAB_OUTBOX_FAULT_CRASH_AFTER_ACK_EVENT_ID:-}"
      BANKING_LAB_OUTBOX_FAULT_CRASH_AFTER_ACK_EXIT_CODE: "${BANKING_LAB_OUTBOX_FAULT_CRASH_AFTER_ACK_EXIT_CODE:-88}"
      BANKING_LAB_TRACING_ENABLED: "${BANKING_LAB_TRACING_ENABLED:-true}"
      BANKING_LAB_OTLP_TRACING_EXPORT_ENABLED: "${BANKING_LAB_OTLP_TRACING_EXPORT_ENABLED:-true}"
      BANKING_LAB_OTLP_TRACES_ENDPOINT: "${BANKING_LAB_OTLP_TRACES_ENDPOINT:-http://tempo:4318/v1/traces}"
      BANKING_LAB_OTEL_SERVICE_NAME: banking-lab-core-banking-outbox-worker
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
  payment-service:
    build:
      context: .
      dockerfile: infra/docker-compose/payment-service.Dockerfile
    profiles:
      - platform
    environment:
      BANKING_LAB_PAYMENT_DATABASE_URL: jdbc:postgresql://postgres:5432/banking_lab
      BANKING_LAB_PAYMENT_DATABASE_USER: banking_lab
      BANKING_LAB_PAYMENT_DATABASE_PASSWORD: banking_lab
      SPRING_FLYWAY_TABLE: payment_flyway_schema_history
      BANKING_LAB_SYNTHETIC_ONLY: "true"
      BANKING_LAB_PAYMENT_CORE_BANKING_HTTP_ENABLED: "true"
      BANKING_LAB_CORE_BANKING_BASE_URL: http://core-banking:8081
      BANKING_LAB_PAYMENT_CORE_BANKING_SERVICE_TOKEN: "${BANKING_LAB_PAYMENT_CORE_BANKING_SERVICE_TOKEN:-}"
      BANKING_LAB_PAYMENT_CORE_BANKING_TOKEN_URL: "${BANKING_LAB_PAYMENT_CORE_BANKING_TOKEN_URL:-http://keycloak:8080/realms/banking-lab/protocol/openid-connect/token}"
      BANKING_LAB_PAYMENT_CORE_BANKING_CLIENT_ID: "${BANKING_LAB_PAYMENT_CORE_BANKING_CLIENT_ID:-payment-service-api}"
      BANKING_LAB_PAYMENT_CORE_BANKING_CLIENT_SECRET: "${BANKING_LAB_PAYMENT_CORE_BANKING_CLIENT_SECRET:-payment-service-api-secret}"
      BANKING_LAB_PAYMENT_LEDGER_COMMAND_TOPIC: "${BANKING_LAB_PAYMENT_LEDGER_COMMAND_TOPIC:-banking.lab.core-banking.ledger-commands}"
      BANKING_LAB_PAYMENT_OUTBOX_WORKER_ENABLED: "false"
      BANKING_LAB_PAYMENT_DOMAIN_EVENT_PUBLISHER_BOOTSTRAP_SERVERS: redpanda:9092
      BANKING_LAB_PAYMENT_DOMAIN_EVENT_PUBLISHER_TOPIC: "${BANKING_LAB_PAYMENT_DOMAIN_EVENT_PUBLISHER_TOPIC:-banking.lab.payment-events}"
      BANKING_LAB_PAYMENT_DOMAIN_EVENT_PUBLISHER_ENABLED: "false"
