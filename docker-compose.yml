services:
  banking-lab:
    build:
      context: .
      dockerfile: infra/docker-compose/Dockerfile
    environment:
      NODE_ENV: development
      PORT: "8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
  postgres:
    image: postgres:16-alpine
    profiles:
      - migration
    environment:
      POSTGRES_DB: banking_lab
      POSTGRES_USER: banking_lab
      POSTGRES_PASSWORD: banking_lab
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking_lab -d banking_lab"]
      interval: 10s
      timeout: 3s
      retries: 5
