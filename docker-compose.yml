      BANKING_LAB_NOTIFICATION_EVENT_CONSUMER_GROUP_ID: "${BANKING_LAB_NOTIFICATION_EVENT_CONSUMER_GROUP_ID:-notification-service}"
      BANKING_LAB_NOTIFICATION_EVENT_CONSUMER_BATCH_SIZE: "${BANKING_LAB_NOTIFICATION_EVENT_CONSUMER_BATCH_SIZE:-100}"
      BANKING_LAB_NOTIFICATION_EVENT_CONSUMER_POLL_INTERVAL_MILLIS: "${BANKING_LAB_NOTIFICATION_EVENT_CONSUMER_POLL_INTERVAL_MILLIS:-1000}"
      BANKING_LAB_NOTIFICATION_EVENT_CONSUMER_POLL_TIMEOUT_MILLIS: "${BANKING_LAB_NOTIFICATION_EVENT_CONSUMER_POLL_TIMEOUT_MILLIS:-5000}"
      BANKING_LAB_NOTIFICATION_EVENT_CONSUMER_DEFAULT_CHANNEL: "${BANKING_LAB_NOTIFICATION_EVENT_CONSUMER_DEFAULT_CHANNEL:-SMS}"
      BANKING_LAB_NOTIFICATION_EVENT_CONSUMER_REQUESTED_BY: "${BANKING_LAB_NOTIFICATION_EVENT_CONSUMER_REQUESTED_BY:-notification-compose-event-consumer}"
      BANKING_LAB_NOTIFICATION_EVENT_CONSUMER_SUPPORTED_EVENT_TYPES: "${BANKING_LAB_NOTIFICATION_EVENT_CONSUMER_SUPPORTED_EVENT_TYPES:-LedgerTransactionPosted,PaymentLedgerPostingRequested,ComplaintAnswered}"
      BANKING_LAB_SECURITY_ENABLED: "${BANKING_LAB_SECURITY_ENABLED:-true}"
      BANKING_LAB_SECURITY_SIMULATOR_TOKENS_ENABLED: "${BANKING_LAB_SECURITY_SIMULATOR_TOKENS_ENABLED:-false}"
      BANKING_LAB_DEV_SIMULATOR_TOKEN: "${BANKING_LAB_DEV_SIMULATOR_TOKEN:-false}"
      BANKING_LAB_SECURITY_JWKS_URI: "${BANKING_LAB_SECURITY_JWKS_URI:-http://keycloak:8080/realms/banking-lab/protocol/openid-connect/certs}"
      BANKING_LAB_SECURITY_ISSUER: "${BANKING_LAB_SECURITY_ISSUER:-http://localhost:${BANKING_LAB_KEYCLOAK_PORT:-8085}/realms/banking-lab}"
      BANKING_LAB_SECURITY_AUDIENCE: "${BANKING_LAB_NOTIFICATION_SECURITY_AUDIENCE:-notification-service-api}"
      BANKING_LAB_TRACING_ENABLED: "${BANKING_LAB_TRACING_ENABLED:-true}"
      BANKING_LAB_OTLP_TRACING_EXPORT_ENABLED: "${BANKING_LAB_OTLP_TRACING_EXPORT_ENABLED:-true}"
      BANKING_LAB_OTLP_TRACES_ENDPOINT: "${BANKING_LAB_OTLP_TRACES_ENDPOINT:-http://tempo:4318/v1/traces}"
      BANKING_LAB_OTEL_SERVICE_NAME: banking-lab-notification-event-consumer
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
  reporting-service:
    build:
      context: .
      dockerfile: infra/docker-compose/reporting-service.Dockerfile
    profiles:
      - platform
    environment:
      BANKING_LAB_REPORTING_DATABASE_URL: jdbc:postgresql://postgres:5432/banking_lab
      BANKING_LAB_REPORTING_DATABASE_USER: banking_lab
      BANKING_LAB_REPORTING_DATABASE_PASSWORD: banking_lab
      SPRING_FLYWAY_TABLE: reporting_flyway_schema_history
      BANKING_LAB_SYNTHETIC_ONLY: "true"
      BANKING_LAB_REPORTING_ARTIFACT_ROOT: /app/reports/synthetic
      BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_ENABLED: "false"
      BANKING_LAB_SECURITY_ENABLED: "${BANKING_LAB_SECURITY_ENABLED:-true}"
      BANKING_LAB_SECURITY_SIMULATOR_TOKENS_ENABLED: "${BANKING_LAB_SECURITY_SIMULATOR_TOKENS_ENABLED:-false}"
      BANKING_LAB_DEV_SIMULATOR_TOKEN: "${BANKING_LAB_DEV_SIMULATOR_TOKEN:-false}"
      BANKING_LAB_SECURITY_JWKS_URI: "${BANKING_LAB_SECURITY_JWKS_URI:-http://keycloak:8080/realms/banking-lab/protocol/openid-connect/certs}"
      BANKING_LAB_SECURITY_ISSUER: "${BANKING_LAB_SECURITY_ISSUER:-http://localhost:${BANKING_LAB_KEYCLOAK_PORT:-8085}/realms/banking-lab}"
      BANKING_LAB_SECURITY_AUDIENCE: "${BANKING_LAB_REPORTING_SECURITY_AUDIENCE:-reporting-service-api}"
      BANKING_LAB_TRACING_ENABLED: "${BANKING_LAB_TRACING_ENABLED:-true}"
      BANKING_LAB_OTLP_TRACING_EXPORT_ENABLED: "${BANKING_LAB_OTLP_TRACING_EXPORT_ENABLED:-true}"
      BANKING_LAB_OTLP_TRACES_ENDPOINT: "${BANKING_LAB_OTLP_TRACES_ENDPOINT:-http://tempo:4318/v1/traces}"
      BANKING_LAB_OTEL_SERVICE_NAME: banking-lab-reporting-service
    ports:
      - "${BANKING_LAB_REPORTING_SERVICE_PORT:-8090}:8090"
    depends_on:
      postgres:
        condition: service_healthy
  reporting-domain-event-publisher:
    build:
      context: .
      dockerfile: infra/docker-compose/reporting-service.Dockerfile
    profiles:
      - platform
    environment:
      BANKING_LAB_REPORTING_DATABASE_URL: jdbc:postgresql://postgres:5432/banking_lab
      BANKING_LAB_REPORTING_DATABASE_USER: banking_lab
      BANKING_LAB_REPORTING_DATABASE_PASSWORD: banking_lab
      SPRING_FLYWAY_TABLE: reporting_flyway_schema_history
      BANKING_LAB_SYNTHETIC_ONLY: "true"
      BANKING_LAB_REPORTING_ARTIFACT_ROOT: /app/reports/synthetic
      BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_BOOTSTRAP_SERVERS: redpanda:9092
      BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_TOPIC: "${BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_TOPIC:-banking.lab.reporting-events}"
      BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_ENABLED: "true"
      BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_CLIENT_ID: "${BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_CLIENT_ID:-reporting-compose-domain-event-publisher}"
      BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_BATCH_SIZE: "${BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_BATCH_SIZE:-100}"
      BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_POLL_INTERVAL_MILLIS: "${BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_POLL_INTERVAL_MILLIS:-1000}"
      BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_TIMEOUT_MILLIS: "${BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_TIMEOUT_MILLIS:-5000}"
      BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_DEAD_LETTER_THRESHOLD: "${BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_DEAD_LETTER_THRESHOLD:-3}"
      BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_RETRY_DELAY_SECONDS: "${BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_RETRY_DELAY_SECONDS:-60}"
      BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_EVENT_TYPES: "${BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_EVENT_TYPES:-ReportArtifactGenerated,ReportArtifactExported,ReportRetentionSweepCompleted}"
      BANKING_LAB_SECURITY_ENABLED: "${BANKING_LAB_SECURITY_ENABLED:-true}"
      BANKING_LAB_SECURITY_SIMULATOR_TOKENS_ENABLED: "${BANKING_LAB_SECURITY_SIMULATOR_TOKENS_ENABLED:-false}"
      BANKING_LAB_DEV_SIMULATOR_TOKEN: "${BANKING_LAB_DEV_SIMULATOR_TOKEN:-false}"
      BANKING_LAB_SECURITY_JWKS_URI: "${BANKING_LAB_SECURITY_JWKS_URI:-http://keycloak:8080/realms/banking-lab/protocol/openid-connect/certs}"
      BANKING_LAB_SECURITY_ISSUER: "${BANKING_LAB_SECURITY_ISSUER:-http://localhost:${BANKING_LAB_KEYCLOAK_PORT:-8085}/realms/banking-lab}"
      BANKING_LAB_SECURITY_AUDIENCE: "${BANKING_LAB_REPORTING_SECURITY_AUDIENCE:-reporting-service-api}"
      BANKING_LAB_TRACING_ENABLED: "${BANKING_LAB_TRACING_ENABLED:-true}"
      BANKING_LAB_OTLP_TRACING_EXPORT_ENABLED: "${BANKING_LAB_OTLP_TRACING_EXPORT_ENABLED:-true}"
      BANKING_LAB_OTLP_TRACES_ENDPOINT: "${BANKING_LAB_OTLP_TRACES_ENDPOINT:-http://tempo:4318/v1/traces}"
      BANKING_LAB_OTEL_SERVICE_NAME: banking-lab-reporting-domain-event-publisher
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
  aml-fds-analytics:
    build:
      context: .
      dockerfile: infra/docker-compose/analytics.Dockerfile
    profiles:
      - analytics
      - platform
    environment:
      BANKING_LAB_SYNTHETIC_ONLY: "true"
  redis:
    image: redis:7-alpine
    profiles:
      - platform
    ports:
      - "${BANKING_LAB_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  redpanda:
    image: redpandadata/redpanda:v24.3.7
    profiles:
      - platform
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      - --advertise-kafka-addr
      - INTERNAL://redpanda:9092,EXTERNAL://${BANKING_LAB_REDPANDA_ADVERTISE_HOST:-127.0.0.1}:${BANKING_LAB_REDPANDA_PORT:-9092}
    ports:
      - "${BANKING_LAB_REDPANDA_PORT:-9092}:29092"
      - "${BANKING_LAB_REDPANDA_ADMIN_PORT:-9644}:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles:
      - platform
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "${BANKING_LAB_KEYCLOAK_PORT:-8085}:8080"
    volumes:
      - ./infra/keycloak/realm-banking-lab.json:/opt/keycloak/data/import/realm-banking-lab.json:ro
  temporal:
    image: temporalio/auto-setup:1.26
    profiles:
      - platform
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: banking_lab
      POSTGRES_PWD: banking_lab
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "${BANKING_LAB_TEMPORAL_PORT:-7233}:7233"
    volumes:
      - ./infra/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
  prometheus:
    image: prom/prometheus:v3.0.1
    profiles:
      - platform
    ports:
      - "${BANKING_LAB_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  grafana:
    image: grafana/grafana:11.4.0
    profiles:
      - platform
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "${BANKING_LAB_GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
  loki:
    image: grafana/loki:3.3.2
    profiles:
      - platform
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "${BANKING_LAB_LOKI_PORT:-3100}:3100"
    volumes:
      - ./infra/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - ./infra/observability/loki/rules:/etc/loki/rules:ro
      - loki-data:/loki
  promtail:
    image: grafana/promtail:3.3.2
    profiles:
      - platform
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./infra/observability/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
  tempo:
    image: grafana/tempo:2.6.1
    profiles:
      - platform
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "${BANKING_LAB_TEMPO_PORT:-3200}:3200"
      - "${BANKING_LAB_TEMPO_OTLP_GRPC_PORT:-4317}:4317"
      - "${BANKING_LAB_TEMPO_OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./infra/observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo

volumes:
  postgres-data:
  redpanda-data:
  grafana-data:
  loki-data:
  tempo-data:
