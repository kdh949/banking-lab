  /api/payments/settlement/imports:
    post:
      summary: Import an independent synthetic external settlement CSV
      operationId: importExternalSettlementCsv
      x-api-client-required: false
      x-idempotent-command: true
      x-idempotency-policy: body.idempotencyKey
      x-reason-required: true
      x-reason-policy: body.reason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportExternalSettlementCsvRequest'
      responses:
        '201':
          description: Independent external file provenance and raw staging lines persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalSettlementImportResponse'
        '200':
          description: Idempotent replay of the same external settlement import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalSettlementImportResponse'
        '409':
          description: Reused idempotency key or duplicate SHA-256 file digest
  /api/payments/settlement/imports/{importId}:
    get:
      summary: Read external settlement import provenance and raw staging lines
      operationId: getExternalSettlementImport
      x-api-client-required: false
      parameters:
        - name: importId
          in: path
          required: true
          schema:
            type: string
            pattern: '^ESI-'
      responses:
        '200':
          description: External settlement import and preserved raw rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalSettlementImportResponse'
  /api/payments/settlement/batch-runs:
    post:
      summary: Build per-biller settlement positions from accepted external rows
      operationId: createSettlementBatchRun
      x-api-client-required: false
      x-idempotent-command: true
      x-idempotency-policy: body.idempotencyKey
      x-reason-required: true
      x-reason-policy: body.reason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSettlementBatchRunRequest'
      responses:
        '201':
          description: Gross, fee, VAT, and net positions created with INCLUDED_IN_BATCH status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementBatchRunResponse'
        '200':
          description: Idempotent replay of the same settlement batch run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementBatchRunResponse'
        '409':
          description: Import already batched or no accepted external lines
  /api/payments/settlement/batch-runs/{batchRunId}:
    get:
      summary: Read a durable synthetic settlement batch run
      operationId: getSettlementBatchRun
      x-api-client-required: false
      parameters:
        - name: batchRunId
          in: path
          required: true
          schema:
            type: string
            pattern: '^SBR-'
      responses:
        '200':
          description: Per-biller positions; payout or final settlement is not implied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementBatchRunResponse'
