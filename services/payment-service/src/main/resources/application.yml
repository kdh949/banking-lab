server:
  port: ${PORT:8088}

banking-lab:
  synthetic-only: true
  migration-target: kotlin-spring-boot
  payment-service:
    core-ledger-command-topic: ${BANKING_LAB_PAYMENT_LEDGER_COMMAND_TOPIC:banking.lab.core-banking.ledger-commands}
    real-payment-network-enabled: false
    core-banking:
      http-enabled: ${BANKING_LAB_PAYMENT_CORE_BANKING_HTTP_ENABLED:true}
      base-url: ${BANKING_LAB_CORE_BANKING_BASE_URL:http://localhost:8081}
      service-token: ${BANKING_LAB_PAYMENT_CORE_BANKING_SERVICE_TOKEN:}
    outbox-worker:
      enabled: ${BANKING_LAB_PAYMENT_OUTBOX_WORKER_ENABLED:false}
      initial-delay-ms: ${BANKING_LAB_PAYMENT_OUTBOX_WORKER_INITIAL_DELAY_MS:5000}
      fixed-delay-ms: ${BANKING_LAB_PAYMENT_OUTBOX_WORKER_FIXED_DELAY_MS:5000}
      max-batch-size: ${BANKING_LAB_PAYMENT_OUTBOX_WORKER_MAX_BATCH_SIZE:10}
      dead-letter-threshold: ${BANKING_LAB_PAYMENT_OUTBOX_WORKER_DEAD_LETTER_THRESHOLD:3}
      requested-by: ${BANKING_LAB_PAYMENT_OUTBOX_WORKER_REQUESTED_BY:payment-service-outbox-worker}
      reason: ${BANKING_LAB_PAYMENT_OUTBOX_WORKER_REASON:Synthetic payment outbox worker dispatch}
  security:
    enabled: ${BANKING_LAB_SECURITY_ENABLED:true}
    simulator-tokens-enabled: ${BANKING_LAB_SECURITY_SIMULATOR_TOKENS_ENABLED:false}
    dev-simulator-token-enabled: ${BANKING_LAB_DEV_SIMULATOR_TOKEN:false}
    jwt:
      jwks-uri: ${BANKING_LAB_SECURITY_JWKS_URI:}
      issuer: ${BANKING_LAB_SECURITY_ISSUER:}
      audience: ${BANKING_LAB_SECURITY_AUDIENCE:}

spring:
  application:
    name: banking-lab-payment-service
  datasource:
    url: ${BANKING_LAB_PAYMENT_DATABASE_URL:jdbc:postgresql://localhost:5432/banking_lab_payment}
    username: ${BANKING_LAB_PAYMENT_DATABASE_USER:banking_lab}
    password: ${BANKING_LAB_PAYMENT_DATABASE_PASSWORD:banking_lab}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    enabled: ${BANKING_LAB_TRACING_ENABLED:false}
    propagation:
      type: w3c
    sampling:
      probability: ${BANKING_LAB_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      export:
        enabled: ${BANKING_LAB_OTLP_TRACING_EXPORT_ENABLED:false}
      endpoint: ${BANKING_LAB_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  opentelemetry:
    resource-attributes:
      service.name: ${BANKING_LAB_OTEL_SERVICE_NAME:banking-lab-payment-service}
      synthetic.only: "true"
