server:
  port: ${PORT:8088}

banking-lab:
  synthetic-only: true
  migration-target: kotlin-spring-boot
  payment-service:
    core-ledger-command-topic: ${BANKING_LAB_PAYMENT_LEDGER_COMMAND_TOPIC:banking.lab.core-banking.ledger-commands}
    real-payment-network-enabled: false

spring:
  application:
    name: banking-lab-payment-service
  datasource:
    url: ${BANKING_LAB_PAYMENT_DATABASE_URL:jdbc:postgresql://localhost:5432/banking_lab_payment}
    username: ${BANKING_LAB_PAYMENT_DATABASE_USER:banking_lab}
    password: ${BANKING_LAB_PAYMENT_DATABASE_PASSWORD:banking_lab}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    enabled: ${BANKING_LAB_TRACING_ENABLED:false}
    propagation:
      type: w3c
    sampling:
      probability: ${BANKING_LAB_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      export:
        enabled: ${BANKING_LAB_OTLP_TRACING_EXPORT_ENABLED:false}
      endpoint: ${BANKING_LAB_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  opentelemetry:
    resource-attributes:
      service.name: ${BANKING_LAB_OTEL_SERVICE_NAME:banking-lab-payment-service}
      synthetic.only: "true"
