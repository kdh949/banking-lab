components:
  responses:
    AnyJsonResponse:
      description: Synthetic banking response payload. Detailed DTOs are defined in the shared TypeScript API client for this phase.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnyJson'
    StructuredErrorResponse:
      description: Structured banking API error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StructuredError'
  schemas:
    AnyJson:
      type: object
      additionalProperties: true
    StructuredError:
      type: object
      required: [code, message, traceId, syntheticOnly]
      properties:
        code: { type: string }
        message: { type: string }
        traceId: { type: string }
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: true
        syntheticOnly:
          const: true
    PostingDirection:
      type: string
      enum: [DEBIT, CREDIT]
    DepositCommand:
      type: object
      required: [accountId, amountMinor, idempotencyKey]
      properties:
        accountId: { type: string }
        amountMinor:
          type: integer
          exclusiveMinimum: 0
        idempotencyKey: { type: string }
        requestedBy:
          type: string
          default: SYSTEM
        requestedChannel:
          type: string
          default: CORE_BANKING
        businessDate:
          type: string
          format: date
          nullable: true
        reason:
          type: string
          nullable: true
        currency:
          type: string
          default: KRW
        businessReferenceId:
          type: string
          nullable: true
    WithdrawalCommand:
      type: object
      required: [accountId, amountMinor, idempotencyKey]
      properties:
        accountId: { type: string }
        amountMinor:
          type: integer
          exclusiveMinimum: 0
        idempotencyKey: { type: string }
        requestedBy:
          type: string
          default: SYSTEM
        requestedChannel:
          type: string
          default: CORE_BANKING
        businessDate:
          type: string
          format: date
          nullable: true
        reason:
          type: string
          nullable: true
        currency:
          type: string
          default: KRW
        businessReferenceId:
          type: string
          nullable: true
    InternalTransferCommand:
      type: object
      required: [fromAccountId, toAccountId, amountMinor, idempotencyKey]
      properties:
        fromAccountId: { type: string }
        toAccountId: { type: string }
        amountMinor:
          type: integer
          exclusiveMinimum: 0
        idempotencyKey: { type: string }
        requestedBy:
          type: string
          default: SYSTEM
        requestedChannel:
          type: string
          default: CORE_BANKING
        businessDate:
          type: string
          format: date
          nullable: true
        reason:
          type: string
          nullable: true
        currency:
          type: string
          default: KRW
        businessReferenceId:
          type: string
          nullable: true
    ReversalCommand:
      type: object
      required: [originalTransactionId, idempotencyKey]
      properties:
        originalTransactionId: { type: string }
        idempotencyKey: { type: string }
        requestedBy:
          type: string
          default: SYSTEM
        requestedChannel:
          type: string
          default: CORE_BANKING
        businessDate:
          type: string
          format: date
          nullable: true
        reason:
          type: string
          nullable: true
        businessReferenceId:
          type: string
          nullable: true
    AdjustmentCommand:
      type: object
      required: [accountId, amountMinor, idempotencyKey]
      properties:
        accountId: { type: string }
        direction:
          $ref: '#/components/schemas/PostingDirection'
        amountMinor:
          type: integer
          exclusiveMinimum: 0
        idempotencyKey: { type: string }
        requestedBy:
          type: string
          default: SYSTEM
        requestedChannel:
          type: string
          default: CORE_BANKING
        businessDate:
          type: string
          format: date
          nullable: true
        reason:
          type: string
          nullable: true
        currency:
          type: string
          default: KRW
        businessReferenceId:
          type: string
          nullable: true
        approvalId:
          type: string
          nullable: true
    BillPaymentCommand:
      type: object
      required: [paymentInstructionId, debitAccountId, syntheticBillerId, amountMinor, idempotencyKey, requestedBy, reason]
      properties:
        paymentInstructionId: { type: string }
        debitAccountId: { type: string }
        syntheticBillerId: { type: string }
        amountMinor:
          type: integer
          exclusiveMinimum: 0
        idempotencyKey: { type: string }
        requestedBy: { type: string }
        requestedChannel:
          type: string
          default: PAYMENT_SERVICE
        businessDate:
          type: string
          format: date
          nullable: true
        reason: { type: string }
        currency:
          type: string
          default: KRW
    ReconciliationDailyClosingCommand:
      type: object
      properties:
        businessDate:
          type: string
          format: date
          nullable: true
        idempotencyKey:
          type: string
          nullable: true
        requestedBy:
          type: string
          nullable: true
        actorRole:
          type: string
          nullable: true
        externalMode:
          type: string
          nullable: true
    LedgerCommandResult:
      type: object
      required: [value, replayed]
      properties:
        value:
          $ref: '#/components/schemas/LedgerTransactionDto'
        replayed:
          type: boolean
    LedgerTransactionDto:
      type: object
      required: [id, transactionType, businessReferenceId, idempotencyKey, businessDate, status, requestedBy, requestedChannel, postings]
      properties:
        id: { type: string }
        transactionType: { type: string }
        businessReferenceId: { type: string }
        idempotencyKey: { type: string }
        businessDate:
          type: string
          format: date
        status: { type: string }
        requestedBy: { type: string }
        requestedChannel: { type: string }
        postedAt:
          type: string
          format: date-time
          nullable: true
        originalTransactionId:
          type: string
          nullable: true
        postings:
          type: array
          items:
            $ref: '#/components/schemas/LedgerPostingDto'
    LedgerPostingDto:
      type: object
      required: [id, ledgerTransactionId, accountId, currency, direction, amountMinor, postingType]
      properties:
        id: { type: string }
        ledgerTransactionId: { type: string }
        accountId: { type: string }
        currency: { type: string }
        direction:
          $ref: '#/components/schemas/PostingDirection'
        amountMinor:
          type: integer
          exclusiveMinimum: 0
        postingType: { type: string }
        createdAt:
          type: string
          format: date-time
          nullable: true
    ReconciliationClosingResponse:
      type: object
      required: [item, externalFile, reconciliationItems, replayed]
      properties:
        item:
          $ref: '#/components/schemas/ReconciliationClosingDto'
        externalFile:
          $ref: '#/components/schemas/ReconciliationExternalFileDto'
        reconciliationItems:
          type: array
          items:
            $ref: '#/components/schemas/ReconciliationItemDto'
        replayed:
          type: boolean
    ReconciliationClosingDto:
      type: object
      required: [closingId, businessDate, status, ledgerInvariantValid, internalEntryCount, externalEntryCount, unmatchedItemCount, internalTotalMinor, externalTotalMinor]
      properties:
        closingId: { type: string }
        businessDate:
          type: string
          format: date
        status: { type: string }
        ledgerInvariantValid: { type: boolean }
        internalEntryCount: { type: integer }
        externalEntryCount: { type: integer }
        unmatchedItemCount: { type: integer }
        internalTotalMinor: { type: integer }
        externalTotalMinor: { type: integer }
    ReconciliationExternalFileDto:
      type: object
      required: [fileId, businessDate, entries]
      properties:
        fileId: { type: string }
        businessDate:
          type: string
          format: date
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ReconciliationExternalEntryDto'
    ReconciliationExternalEntryDto:
      type: object
      required: [referenceId, businessDate, amountMinor, status]
      properties:
        referenceId: { type: string }
        businessDate:
          type: string
          format: date
        amountMinor: { type: integer }
        status: { type: string }
        provider:
          type: string
          default: OPENBANKING-SIM
    ReconciliationItemDto:
      type: object
      required: [itemId, businessDate, sourceSystem, mismatchType, amountMinor, detectedReason, currency, status, createdAt]
      properties:
        itemId: { type: string }
        businessDate:
          type: string
          format: date
        sourceSystem: { type: string }
        internalReferenceId:
          type: string
          nullable: true
        externalReferenceId:
          type: string
          nullable: true
        mismatchType: { type: string }
        amountMinor: { type: integer }
        internalAmountMinor:
          type: integer
          nullable: true
        externalAmountMinor:
          type: integer
          nullable: true
        externalStatus:
          type: string
          nullable: true
        feedFileId:
          type: string
          nullable: true
        detectedReason: { type: string }
        currency: { type: string }
        status: { type: string }
        owner:
          type: string
          nullable: true
        approvalId:
          type: string
          nullable: true
        adjustmentTransactionId:
          type: string
          nullable: true
        adjustmentRequest:
          $ref: '#/components/schemas/ReconciliationAdjustmentRequestDto'
          nullable: true
        createdAt:
          type: string
          format: date-time
    ReconciliationAdjustmentRequestDto:
      type: object
      required: [requestId, approvalId, accountId, direction, amountMinor, businessDate, idempotencyKey, reason, requestedBy, status, createdAt, updatedAt]
      properties:
        requestId: { type: string }
        approvalId: { type: string }
        accountId: { type: string }
        direction:
          $ref: '#/components/schemas/PostingDirection'
        amountMinor: { type: integer }
        businessDate:
          type: string
          format: date
        idempotencyKey: { type: string }
        reason: { type: string }
        requestedBy: { type: string }
        status: { type: string }
        ledgerTransactionId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        temporalWorkflow:
          $ref: '#/components/schemas/TemporalWorkflowReference'
          nullable: true
    TemporalWorkflowReference:
      type: object
      required: [workflowId]
      properties:
        workflowId: { type: string }
        runId:
          type: string
          nullable: true
