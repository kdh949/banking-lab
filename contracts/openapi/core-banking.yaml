openapi: 3.1.0
info:
  title: Banking Lab Synthetic Core Banking API
  version: 0.1.0
  description: Synthetic-only core banking, staff operations, ledger projection integrity, customer channel, complaint, card, loan, product, parameter, audit, FDS, AML, and admin APIs.
x-banking-lab-contract:
  syntheticOnly: true
  structuredErrorDefault: '#/components/responses/StructuredErrorResponse'
paths:
  /api/auth/customer/signup:
    post:
      operationId: signupCustomer
      x-synthetic-only: true
      x-idempotent-command: true
      x-idempotency-policy: body.idempotencyKey
      responses: { '201': { $ref: '#/components/responses/AnyJsonResponse' }, '200': { $ref: '#/components/responses/AnyJsonResponse' }, default: { $ref: '#/components/responses/StructuredErrorResponse' } }
  /api/auth/customer/login:
    post:
      operationId: loginCustomer
      x-synthetic-only: true
      x-synthetic-auth-dev-test-only: true
      responses: { '200': { $ref: '#/components/responses/AnyJsonResponse' }, default: { $ref: '#/components/responses/StructuredErrorResponse' } }
  /api/auth/session:
    get:
      operationId: authSession
      x-api-client-required: false
      x-synthetic-only: true
      responses: { '200': { $ref: '#/components/responses/AnyJsonResponse' }, default: { $ref: '#/components/responses/StructuredErrorResponse' } }
  /api/customer/me:
    get:
      operationId: customerProfile
      x-synthetic-only: true
      x-ownership-enforced: token.customerId
      responses:
        '200':
          description: Token-owned synthetic customer profile with masked PII
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfileDto'
        default: { $ref: '#/components/responses/StructuredErrorResponse' }
  /api/customer/account-opening-requests:
    post:
      operationId: requestCustomerAccountOpening
      x-synthetic-only: true
      x-ownership-enforced: token.customerId
      x-idempotent-command: true
      x-idempotency-policy: body.idempotencyKey
      x-maker-checker-required: staff-followup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerSelfServiceAccountOpeningCommand'
      responses:
        '201':
          description: Customer self-service account-opening intake created without account or ledger rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSelfServiceAccountOpeningRequestResponse'
        '200':
          description: Idempotent replay of the same customer account-opening intake
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSelfServiceAccountOpeningRequestResponse'
        default: { $ref: '#/components/responses/StructuredErrorResponse' }
    get:
      operationId: customerAccountOpeningRequests
      x-synthetic-only: true
      x-ownership-enforced: token.customerId
      responses:
        '200':
          description: Token-owned customer account-opening intake list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSelfServiceAccountOpeningRequestListResponse'
        default: { $ref: '#/components/responses/StructuredErrorResponse' }
  /api/customer/360:
    get:
      operationId: customer360
      x-synthetic-only: true
      x-ownership-enforced: token.customerId
      responses:
        '200':
          description: Token-owned Customer 360 read model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer360Dto'
        default: { $ref: '#/components/responses/StructuredErrorResponse' }
  /api/customer/accounts:
    get:
      operationId: customerAccounts
      x-synthetic-only: true
      parameters: [{ name: customerId, in: query, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Owned customer account list with masked account numbers
          content:
            application/json:
              schema:
