components:
  responses:
    AnyJsonResponse:
      description: Synthetic banking response payload. Detailed DTOs are defined in the shared TypeScript API client for this phase.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnyJson'
    StructuredErrorResponse:
      description: Structured banking API error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StructuredError'
  schemas:
    AnyJson:
      type: object
      additionalProperties: true
    StructuredError:
      type: object
      required: [code, message, traceId, syntheticOnly]
      properties:
        code: { type: string }
        message: { type: string }
        traceId: { type: string }
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: true
        syntheticOnly:
          const: true
