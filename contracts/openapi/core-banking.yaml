        default:
          $ref: '#/components/responses/StructuredErrorResponse'
components:
  responses:
    AnyJsonResponse:
      description: Synthetic banking response payload. Detailed DTOs are defined in the shared TypeScript API client for this phase.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnyJson'
    StructuredErrorResponse:
      description: Structured banking API error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StructuredError'
  schemas:

    PaymentLedgerEvidenceDto:
      type: object
      required:
        - ledgerTransactionId
        - paymentInstructionId
        - businessDate
        - transactionType
        - status
        - currency
        - amountMinor
        - totalDebitMinor
        - totalCreditMinor
        - postingCount
        - balanced
        - syntheticOnly
      properties:
        ledgerTransactionId: { type: string, pattern: '^TX-' }
        paymentInstructionId: { type: string, pattern: '^PAY-' }
        businessDate: { type: string, format: date }
        transactionType: { const: BILL_PAYMENT }
        status: { type: string }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        amountMinor: { type: integer, minimum: 1 }
        totalDebitMinor: { type: integer, minimum: 1 }
        totalCreditMinor: { type: integer, minimum: 1 }
        postingCount: { type: integer, minimum: 2 }
        balanced: { type: boolean }
        postedAt: { type: string, format: date-time, nullable: true }
        syntheticOnly: { const: true }
    PaymentLedgerEvidenceResponse:
      type: object
      required: [items, auditEventId, syntheticOnly]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentLedgerEvidenceDto'
        auditEventId: { type: string, pattern: '^AUD-' }
        syntheticOnly: { const: true }
    AnyJson:
      type: object
      additionalProperties: true
    StructuredError:
      type: object
      required: [code, message, traceId, syntheticOnly]
      properties:
        code: { type: string }
        message: { type: string }
        traceId: { type: string }
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: true
        syntheticOnly:
          const: true
    CustomerAccountDetailDto:
      type: object
      required: [customerId, accountId, maskedAccountNo, status, currency, ledgerBalanceMinor, availableBalanceMinor, holdAmountMinor]
      properties:
        customerId: { type: string }
        accountId: { type: string }
        maskedAccountNo: { type: string }
        status: { type: string }
        currency: { type: string }
        ledgerBalanceMinor: { type: integer }
        availableBalanceMinor: { type: integer }
        holdAmountMinor: { type: integer }
        openedAt: { type: string, format: date-time, nullable: true }
        limits:
          $ref: '#/components/schemas/CustomerAccountLimitsDto'
        holds:
          type: array
          items:
            $ref: '#/components/schemas/CustomerAccountHoldDto'
        recentTransactions:
          type: array
          items:
            $ref: '#/components/schemas/CustomerRecentLedgerActivityDto'
        statementActions:
          type: array
          items:
            $ref: '#/components/schemas/CustomerStatementActionDto'
        syntheticOnly:
          const: true
          default: true
        maskingPolicy:
          type: string
          default: CUSTOMER_SELF
    CustomerAccountListItemDto:
      type: object
      required: [customerId, accountId, maskedAccountNo, status, currency, ledgerBalanceMinor, availableBalanceMinor, holdAmountMinor]
      properties:
        customerId: { type: string }
        accountId: { type: string }
        maskedAccountNo: { type: string }
        status: { type: string }
        currency: { type: string }
        ledgerBalanceMinor: { type: integer }
        availableBalanceMinor: { type: integer }
        holdAmountMinor: { type: integer }
        syntheticOnly:
          const: true
          default: true
    CustomerAccountListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CustomerAccountListItemDto'
        syntheticOnly:
          const: true
          default: true
    CustomerAccountLimitsDto:
      type: object
      required: [dailyTransferLimitMinor, singleTransferLimitMinor]
      properties:
        dailyTransferLimitMinor: { type: integer }
        singleTransferLimitMinor: { type: integer }
        updatedAt: { type: string, format: date-time, nullable: true }
    CustomerAccountHoldDto:
      type: object
      required: [holdId, holdAmountMinor, reasonCode, status, createdAt]
      properties:
        holdId: { type: string }
        holdAmountMinor: { type: integer }
        reasonCode: { type: string }
        status: { type: string }
        approvalId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    CustomerStatementActionDto:
      type: object
      required: [actionType, href, ownershipEnforced, syntheticOnly]
      properties:
        actionType: { type: string }
        href: { type: string }
        ownershipEnforced: { type: boolean, default: true }
        syntheticOnly: { const: true, default: true }
    CustomerRecentLedgerActivityDto:
      type: object
      required: [transactionId, transactionType, businessDate, accountId, direction, amountMinor, signedAmountMinor, currency, postingType, requestedChannel]
      properties:
        transactionId: { type: string }
        transactionType: { type: string }
        businessDate: { type: string, format: date }
        postedAt: { type: string, format: date-time, nullable: true }
        accountId: { type: string }
        maskedAccountNo: { type: string, nullable: true }
        direction: { type: string }
        amountMinor: { type: integer }
        signedAmountMinor: { type: integer }
        currency: { type: string }
        postingType: { type: string }
        requestedChannel: { type: string }
    CustomerOnboardingCheckDto:
      type: object
      required: [checkId, customerId, checkType, status, riskLevel, evidence, createdAt, syntheticOnly]
      properties:
        checkId: { type: string }
        customerId: { type: string }
        checkType: { type: string }
        status: { type: string }
        riskLevel: { type: string }
        evidence:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
        syntheticOnly: { const: true, default: true }
