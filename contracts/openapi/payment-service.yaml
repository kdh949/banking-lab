openapi: 3.1.0
info:
  title: Banking Lab Synthetic Payment Service API
  version: 0.1.0
  description: Synthetic-only bill payment instruction API. It persists payment state and emits durable ledger command requests instead of writing core ledger tables directly. LEDGER_POSTED means the internal core ledger accepted the posting; it does not mean external clearing or settlement completed.
x-banking-lab-contract:
  syntheticOnly: true
  structuredErrorDefault: '#/components/responses/StructuredErrorResponse'
paths:
  /api/payments/instructions:
    post:
      summary: Create a synthetic bill payment instruction
      operationId: createPaymentInstruction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentInstructionRequest'
      responses:
        '201':
          description: Created and ledger posting requested through durable Outbox
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentInstructionResponse'
        '200':
          description: Idempotent replay of the same payment instruction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentInstructionResponse'
        '409':
          description: Idempotency or state conflict
  /api/payments/instructions/{instructionId}:
    get:
      summary: Read a synthetic payment instruction
      operationId: getPaymentInstruction
      parameters:
        - $ref: '#/components/parameters/InstructionId'
        - name: reason
          in: query
          required: false
          description: Required for staff, ops, audit, and compliance payment lookups so PAY-101 access can be audited.
          schema:
            type: string
      responses:
        '200':
          description: Payment instruction, with auditEventId when a staff/ops/audit lookup reason is supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentInstructionResponse'
        '400':
          description: Staff payment lookup reason missing
  /api/payments/instructions/{instructionId}/ledger-postings:
    post:
      summary: Record the successful core-banking ledger posting reference
      operationId: recordPaymentLedgerPosting
      parameters:
        - $ref: '#/components/parameters/InstructionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordPaymentLedgerPostingRequest'
      responses:
        '200':
          description: Ledger posting recorded as LEDGER_POSTED; external clearing and settlement are not implied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentInstructionResponse'
  /api/payments/instructions/{instructionId}/settlements:
    post:
      deprecated: true
      summary: Compatibility alias for recording the core-banking ledger posting reference
      operationId: recordPaymentSettlement
      parameters:
        - $ref: '#/components/parameters/InstructionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordPaymentLedgerPostingRequest'
      responses:
        '200':
          description: Compatibility response using LEDGER_POSTED semantics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentInstructionResponse'
  /api/payments/instructions/{instructionId}/cancel:
    post:
      summary: Cancel before ledger posting
      operationId: cancelPaymentInstruction
      parameters:
        - $ref: '#/components/parameters/InstructionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelPaymentInstructionRequest'
      responses:
        '200':
          description: Cancellation recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentInstructionResponse'
  /api/payments/instructions/{instructionId}/cancellation-requests:
    post:
      summary: Request staff maker-checker approval for pre-ledger-posting payment cancellation
      operationId: requestPaymentCancellationApproval
      parameters:
        - $ref: '#/components/parameters/InstructionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPaymentCancellationApprovalRequest'
      responses:
        '201':
          description: Cancellation request created and pending independent checker approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCancellationRequestResponse'
        '200':
          description: Idempotent replay of the same cancellation request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCancellationRequestResponse'
        '409':
          description: Existing pending request or non-cancelable payment state
  /api/payments/cancellation-requests/{requestId}/approve:
    post:
      summary: Approve staff payment cancellation request as an independent checker
      operationId: approvePaymentCancellationRequest
      parameters:
        - $ref: '#/components/parameters/CancellationRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewPaymentCancellationRequest'
      responses:
        '200':
          description: Cancellation request approved and the payment instruction canceled if still pre-ledger-posting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCancellationRequestResponse'
        '403':
          description: Maker/checker separation failed
  /api/payments/cancellation-requests/{requestId}/reject:
    post:
      summary: Reject staff payment cancellation request as an independent checker
      operationId: rejectPaymentCancellationRequest
      parameters:
        - $ref: '#/components/parameters/CancellationRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewPaymentCancellationRequest'
      responses:
        '200':
          description: Cancellation request rejected without payment instruction mutation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCancellationRequestResponse'
        '403':
          description: Maker/checker separation failed
  /api/payments/outbox/ledger-postings/dispatch-next:
    post:
      summary: Dispatch the next durable payment ledger posting request to core-banking
      operationId: dispatchNextPaymentLedgerPosting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchPaymentLedgerPostingRequest'
      responses:
        '200':
          description: Dispatch result, retry failure, dead letter, or no pending event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentOutboxDispatchResponse'
  /api/payments/autopay/agreements:
    post:
      summary: Create a synthetic autopay agreement
      operationId: createAutopayAgreement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAutopayAgreementRequest'
      responses:
        '201':
          description: Autopay agreement created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAutopayAgreementResponse'
        '200':
          description: Idempotent replay of the same autopay agreement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAutopayAgreementResponse'
  /api/payments/autopay/agreements/{agreementId}:
    get:
      summary: Read a synthetic autopay agreement
      operationId: getAutopayAgreement
      parameters:
        - $ref: '#/components/parameters/AutopayAgreementId'
      responses:
        '200':
          description: Autopay agreement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAutopayAgreementResponse'
  /api/payments/autopay/agreements/{agreementId}/pause:
    post:
      summary: Pause an active synthetic autopay agreement
      operationId: pauseAutopayAgreement
      parameters:
        - $ref: '#/components/parameters/AutopayAgreementId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PauseAutopayAgreementRequest'
      responses:
        '200':
          description: Autopay agreement paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAutopayAgreementResponse'
  /api/payments/autopay/agreements/{agreementId}/resume:
    post:
      summary: Resume a paused synthetic autopay agreement
      operationId: resumeAutopayAgreement
      parameters:
        - $ref: '#/components/parameters/AutopayAgreementId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeAutopayAgreementRequest'
      responses:
        '200':
          description: Autopay agreement resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAutopayAgreementResponse'
  /api/payments/autopay/agreements/{agreementId}/cancel:
    post:
      summary: Cancel a synthetic autopay agreement
      operationId: cancelAutopayAgreement
      parameters:
        - $ref: '#/components/parameters/AutopayAgreementId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAutopayAgreementRequest'
      responses:
        '200':
          description: Autopay agreement canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAutopayAgreementResponse'
  /api/payments/autopay/executions/due:
    post:
      summary: Execute due synthetic autopay agreements by creating payment instructions
      operationId: executeDueAutopay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteDueAutopayRequest'
      responses:
        '200':
          description: Due autopay execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteDueAutopayResponse'
  /api/payments/settlement/imports:
    post:
      summary: Import an independent synthetic external settlement CSV
      operationId: importExternalSettlementCsv
      x-api-client-required: false
      x-idempotent-command: true
      x-idempotency-policy: body.idempotencyKey
      x-reason-required: true
      x-reason-policy: body.reason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportExternalSettlementCsvRequest'
      responses:
        '201':
          description: Independent external file provenance and raw staging lines persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalSettlementImportResponse'
        '200':
          description: Idempotent replay of the same external settlement import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalSettlementImportResponse'
        '409':
          description: Reused idempotency key or duplicate SHA-256 file digest
  /api/payments/settlement/imports/{importId}:
    get:
      summary: Read external settlement import provenance and raw staging lines
      operationId: getExternalSettlementImport
      x-api-client-required: false
      parameters:
        - name: importId
          in: path
          required: true
          schema:
            type: string
            pattern: '^ESI-'
      responses:
        '200':
          description: External settlement import and preserved raw rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalSettlementImportResponse'
  /api/payments/settlement/batch-runs:
    post:
      summary: Build per-biller settlement positions from accepted external rows
      operationId: createSettlementBatchRun
      x-api-client-required: false
      x-idempotent-command: true
      x-idempotency-policy: body.idempotencyKey
      x-reason-required: true
      x-reason-policy: body.reason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSettlementBatchRunRequest'
      responses:
        '201':
          description: Gross, fee, VAT, and net positions created with INCLUDED_IN_BATCH status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementBatchRunResponse'
        '200':
          description: Idempotent replay of the same settlement batch run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementBatchRunResponse'
        '409':
          description: Import already batched or no accepted external lines
  /api/payments/settlement/batch-runs/{batchRunId}:
    get:
      summary: Read a durable synthetic settlement batch run
      operationId: getSettlementBatchRun
      x-api-client-required: false
      parameters:
        - name: batchRunId
          in: path
          required: true
          schema:
            type: string
            pattern: '^SBR-'
      responses:
        '200':
          description: Per-biller positions; payout or final settlement is not implied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementBatchRunResponse'

components:
  responses:
    StructuredErrorResponse:
      description: Structured payment API error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StructuredError'
  parameters:
    InstructionId:
      name: instructionId
      in: path
      required: true
      schema:
        type: string
        pattern: '^PAY-'
    AutopayAgreementId:
      name: agreementId
      in: path
      required: true
      schema:
        type: string
        pattern: '^APAY-'
    CancellationRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        pattern: '^PCR-'
  schemas:
    ImportExternalSettlementCsvRequest:
      type: object
      required:
        - originalFileName
        - institutionCode
        - businessDate
        - csvContent
        - idempotencyKey
        - requestedBy
        - reason
      properties:
        originalFileName:
          type: string
          maxLength: 255
          pattern: '^[^/\\]+[.]csv$'
        institutionCode:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9_-]{2,39}$'
        businessDate:
          type: string
          format: date
        csvContent:
          type: string
          description: Exact independent synthetic external CSV content; SHA-256 is calculated over its UTF-8 bytes.
        idempotencyKey:
          type: string
        requestedBy:
          type: string
          description: Must match the authenticated operations subject.
        reason:
          type: string
    CreateSettlementBatchRunRequest:
      type: object
      required:
        - externalSettlementImportId
        - feeRateBps
        - cutoffAt
        - idempotencyKey
        - requestedBy
        - reason
      properties:
        externalSettlementImportId:
          type: string
          pattern: '^ESI-'
        feeRateBps:
          type: integer
          minimum: 0
          maximum: 10000
        vatRateBps:
          type: integer
          minimum: 0
          maximum: 10000
          default: 1000
        cutoffAt:
          type: string
          format: date-time
        idempotencyKey:
          type: string
        requestedBy:
          type: string
          description: Must match the authenticated operations subject.
        reason:
          type: string
    ExternalSettlementImportStatus:
      type: string
      enum: [IMPORTED, BATCHED]
    ExternalSettlementLineStatus:
      type: string
      enum: [ACCEPTED, REJECTED, RETURNED]
    SettlementBatchStatus:
      type: string
      enum: [INCLUDED_IN_BATCH]
      description: The external rows are included in a durable position; payout and settlement finality are not implied.
    ExternalSettlementLineDto:
      type: object
      required:
        - externalSettlementLineId
        - lineNumber
        - externalReference
        - paymentInstructionId
        - billerId
        - amountMinor
        - currency
        - businessDate
        - valueDate
        - status
        - rawLine
        - syntheticOnly
        - createdAt
      properties:
        externalSettlementLineId:
          type: string
          pattern: '^ESL-'
        lineNumber:
          type: integer
          minimum: 2
        externalReference:
          type: string
        paymentInstructionId:
          type: string
          pattern: '^PAY-'
        billerId:
          type: string
          pattern: '^SYN-BILLER-'
        amountMinor:
          type: integer
          exclusiveMinimum: 0
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        businessDate:
          type: string
          format: date
        valueDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/ExternalSettlementLineStatus'
        rawLine:
          type: string
          description: Original staging row retained independently of internal payment or ledger data.
        syntheticOnly:
          const: true
        createdAt:
          type: string
          format: date-time
    ExternalSettlementImportDto:
      type: object
      required:
        - externalSettlementImportId
        - originalFileName
        - institutionCode
        - fileSha256
        - fileByteSize
        - businessDate
        - status
        - lineCount
        - acceptedLineCount
        - rejectedLineCount
        - requestedBy
        - reason
        - lines
        - syntheticOnly
        - receivedAt
      properties:
        externalSettlementImportId:
          type: string
          pattern: '^ESI-'
        originalFileName:
          type: string
        institutionCode:
          type: string
        fileSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        fileByteSize:
          type: integer
          minimum: 1
          maximum: 1000000
        businessDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/ExternalSettlementImportStatus'
        lineCount:
          type: integer
          minimum: 1
        acceptedLineCount:
          type: integer
          minimum: 0
        rejectedLineCount:
          type: integer
          minimum: 0
          description: Count of non-accepted rows, including REJECTED and RETURNED rows preserved for reconciliation.
        requestedBy:
          type: string
        reason:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ExternalSettlementLineDto'
        syntheticOnly:
          const: true
        receivedAt:
          type: string
          format: date-time
    ExternalSettlementImportResponse:
      type: object
      required: [item, replayed]
      properties:
        item:
          $ref: '#/components/schemas/ExternalSettlementImportDto'
        replayed:
          type: boolean
    SettlementBatchDto:
      type: object
      required:
        - settlementBatchId
        - settlementBatchRunId
        - externalSettlementImportId
        - billerId
        - currency
        - businessDate
        - valueDate
        - cutoffAt
        - grossAmountMinor
        - feeRateBps
        - feeAmountMinor
        - vatRateBps
        - vatAmountMinor
        - adjustmentAmountMinor
        - netAmountMinor
        - itemCount
        - status
        - syntheticOnly
        - createdAt
      properties:
        settlementBatchId:
          type: string
          pattern: '^STB-'
        settlementBatchRunId:
          type: string
          pattern: '^SBR-'
        externalSettlementImportId:
          type: string
          pattern: '^ESI-'
        billerId:
          type: string
          pattern: '^SYN-BILLER-'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        businessDate:
          type: string
          format: date
        valueDate:
          type: string
          format: date
        cutoffAt:
          type: string
          format: date-time
        grossAmountMinor:
          type: integer
          exclusiveMinimum: 0
        feeRateBps:
          type: integer
          minimum: 0
          maximum: 10000
        feeAmountMinor:
          type: integer
          minimum: 0
        vatRateBps:
          type: integer
          minimum: 0
          maximum: 10000
        vatAmountMinor:
          type: integer
          minimum: 0
        adjustmentAmountMinor:
          type: integer
        netAmountMinor:
          type: integer
          minimum: 0
        itemCount:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/SettlementBatchStatus'
        externalPayoutReference:
          type: string
          nullable: true
          description: Null in this foundation slice; no external payout is claimed.
        syntheticOnly:
          const: true
        createdAt:
          type: string
          format: date-time
    SettlementBatchRunResponse:
      type: object
      required:
        - settlementBatchRunId
        - externalSettlementImportId
        - items
        - replayed
        - syntheticOnly
      properties:
        settlementBatchRunId:
          type: string
          pattern: '^SBR-'
        externalSettlementImportId:
          type: string
          pattern: '^ESI-'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SettlementBatchDto'
        replayed:
          type: boolean
        syntheticOnly:
          const: true
    StructuredError:
      type: object
      required: [code, message, traceId, syntheticOnly]
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: true
        syntheticOnly:
          const: true
    CreatePaymentInstructionRequest:
      type: object
      required: [customerId, debitAccountId, billerId, amountMinor, currency, idempotencyKey, requestedBy, requestedChannel]
      properties:
        customerId:
          type: string
        debitAccountId:
          type: string
        billerId:
          type: string
          pattern: '^SYN-BILLER-'
        amountMinor:
          type: integer
          exclusiveMinimum: 0
        currency:
          type: string
          default: KRW
        idempotencyKey:
          type: string
        requestedBy:
          type: string
        requestedChannel:
          type: string
        reason:
          type: string
    RecordPaymentLedgerPostingRequest:
      type: object
      required: [ledgerTransactionId, idempotencyKey, requestedBy, reason]
      properties:
        ledgerTransactionId:
          type: string
          pattern: '^TX-'
        idempotencyKey:
          type: string
        requestedBy:
          type: string
        reason:
          type: string
    CancelPaymentInstructionRequest:
      type: object
      required: [idempotencyKey, requestedBy, reason]
      properties:
        idempotencyKey:
          type: string
        requestedBy:
          type: string
        reason:
          type: string
    RequestPaymentCancellationApprovalRequest:
      type: object
      required: [idempotencyKey, requestedBy, reason]
      properties:
        idempotencyKey:
          type: string
        requestedBy:
          type: string
          description: Must match the authenticated maker subject.
        reason:
          type: string
    ReviewPaymentCancellationRequest:
      type: object
      required: [idempotencyKey, requestedBy, reason]
      properties:
        idempotencyKey:
          type: string
        requestedBy:
          type: string
          description: Must match the authenticated checker subject and differ from the maker.
        reason:
          type: string
    DispatchPaymentLedgerPostingRequest:
      type: object
      required: [requestedBy, reason]
      properties:
        requestedBy:
          type: string
        reason:
          type: string
        deadLetterThreshold:
          type: integer
          minimum: 1
          default: 3
    PaymentOutboxDispatchResponse:
      type: object
      required: [status, retryCount, syntheticOnly]
      properties:
        outboxEventId:
          type: string
          nullable: true
        paymentInstructionId:
          type: string
          nullable: true
        ledgerTransactionId:
          type: string
          nullable: true
        status:
          enum: [PUBLISHED, FAILED, DEAD_LETTER, NO_PENDING_EVENT]
        retryCount:
          type: integer
          minimum: 0
        syntheticOnly:
          const: true
    CreateAutopayAgreementRequest:
      type: object
      required: [customerId, debitAccountId, billerId, amountMinor, currency, frequency, nextRunOn, idempotencyKey, requestedBy, requestedChannel, reason]
      properties:
        customerId:
          type: string
        debitAccountId:
          type: string
        billerId:
          type: string
          pattern: '^SYN-BILLER-'
        amountMinor:
          type: integer
          exclusiveMinimum: 0
        currency:
          type: string
          default: KRW
        frequency:
          enum: [DAILY, WEEKLY, MONTHLY]
        nextRunOn:
          type: string
          format: date
        idempotencyKey:
          type: string
        requestedBy:
          type: string
        requestedChannel:
          type: string
        reason:
          type: string
    PauseAutopayAgreementRequest:
      type: object
      required: [idempotencyKey, requestedBy, reason]
      properties:
        idempotencyKey:
          type: string
        requestedBy:
          type: string
        reason:
          type: string
    ResumeAutopayAgreementRequest:
      type: object
      required: [idempotencyKey, requestedBy, reason]
      properties:
        idempotencyKey:
          type: string
        requestedBy:
          type: string
        reason:
          type: string
        nextRunOn:
          type: string
          format: date
          nullable: true
    CancelAutopayAgreementRequest:
      type: object
      required: [idempotencyKey, requestedBy, reason]
      properties:
        idempotencyKey:
          type: string
        requestedBy:
          type: string
        reason:
          type: string
    ExecuteDueAutopayRequest:
      type: object
      required: [businessDate, idempotencyKey, requestedBy, reason]
      properties:
        businessDate:
          type: string
          format: date
        idempotencyKey:
          type: string
        requestedBy:
          type: string
        reason:
          type: string
        limit:
          type: integer
          minimum: 1
          default: 50
    PaymentAutopayAgreementResponse:
      type: object
      required: [item, replayed]
      properties:
        item:
          $ref: '#/components/schemas/PaymentAutopayAgreement'
        replayed:
          type: boolean
    ExecuteDueAutopayResponse:
      type: object
      required: [items, executedCount, replayed]
      properties:
        items:
          type: array
          items:
