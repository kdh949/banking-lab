asyncapi: 3.0.0
info:
  title: Banking Lab Synthetic Event Backbone
  version: 0.1.0
x-banking-lab-envelope:
  required:
    - syntheticOnly
    - sourceService
    - eventType
    - aggregateId
    - occurredAt
  properties:
    syntheticOnly:
      const: true
    sourceService:
      enum: [core-banking-service, payment-service, notification-service, reporting-service]
    eventType:
      type: string
    aggregateId:
      type: string
    occurredAt:
      type: string
      format: date-time
channels:
  ledger.transaction.posted:
    address: ledger.transaction.posted
    messages:
      LedgerTransactionPosted:
        payload:
          $ref: ../events/ledger-transaction-posted.schema.json
  payment.ledger.posting.requested:
    address: payment.ledger.posting.requested
    messages:
      PaymentLedgerPostingRequested:
        payload:
          $ref: ../events/payment-ledger-posting-requested.schema.json
  payment.ledger.posting.settled:
    address: payment.ledger.posting.settled
    messages:
      PaymentLedgerPostingSettled:
        payload:
          $ref: ../events/payment-ledger-posting-settled.schema.json
  payment.instruction.canceled:
    address: payment.instruction.canceled
    messages:
      PaymentInstructionCanceled:
        payload:
          $ref: ../events/payment-instruction-canceled.schema.json
  payment.instruction.ledger-posted:
    address: payment.instruction.ledger-posted
    messages:
      PaymentInstructionLedgerPosted:
        payload:
          $ref: ../events/payment-instruction-ledger-posted.schema.json
  payment.instruction.settled:
    address: payment.instruction.settled
    messages:
      PaymentInstructionSettled:
        payload:
          $ref: ../events/payment-instruction-settled.schema.json
  payment.instruction.failed:
    address: payment.instruction.failed
    messages:
      PaymentInstructionFailed:
        payload:
          $ref: ../events/payment-instruction-failed.schema.json
  payment.instruction.retry.scheduled:
    address: payment.instruction.retry.scheduled
    messages:
      PaymentInstructionRetryScheduled:
        payload:
          $ref: ../events/payment-instruction-retry-scheduled.schema.json
  payment.instruction.dead-lettered:
    address: payment.instruction.dead-lettered
    messages:
      PaymentInstructionDeadLettered:
        payload:
          $ref: ../events/payment-instruction-dead-lettered.schema.json
  payment.autopay.execution.created:
    address: payment.autopay.execution.created
    messages:
      PaymentAutopayExecutionCreated:
        payload:
          $ref: ../events/payment-autopay-execution-created.schema.json
  notification.delivery.requested:
    address: notification.delivery.requested
    messages:
      NotificationDeliveryRequested:
        payload:
          $ref: ../events/notification-delivery-requested.schema.json
  notification.delivery.attempted:
    address: notification.delivery.attempted
    messages:
      NotificationDeliveryAttempted:
        payload:
          $ref: ../events/notification-delivery-attempted.schema.json
  notification.delivery.delivered:
    address: notification.delivery.delivered
    messages:
      NotificationDeliveryDelivered:
        payload:
          $ref: ../events/notification-delivery-delivered.schema.json
  notification.delivery.failed:
    address: notification.delivery.failed
    messages:
      NotificationDeliveryFailed:
        payload:
          $ref: ../events/notification-delivery-failed.schema.json
  notification.delivery.dead-lettered:
    address: notification.delivery.dead-lettered
    messages:
      NotificationDeliveryDeadLettered:
        payload:
          $ref: ../events/notification-delivery-dead-lettered.schema.json
  report.artifact.generated:
    address: report.artifact.generated
    messages:
      ReportArtifactGenerated:
        payload:
          $ref: ../events/report-artifact-generated.schema.json
  report.artifact.exported:
    address: report.artifact.exported
    messages:
      ReportArtifactExported:
        payload:
          $ref: ../events/report-artifact-exported.schema.json
  report.retention-sweep.completed:
    address: report.retention-sweep.completed
    messages:
      ReportRetentionSweepCompleted:
        payload:
          $ref: ../events/report-retention-sweep-completed.schema.json
operations:
  publishLedgerTransactionPosted:
    action: send
    channel:
      $ref: '#/channels/ledger.transaction.posted'
  publishPaymentLedgerPostingRequested:
    action: send
    channel:
      $ref: '#/channels/payment.ledger.posting.requested'
  publishPaymentLedgerPostingSettled:
    action: send
    channel:
      $ref: '#/channels/payment.ledger.posting.settled'
  publishPaymentInstructionCanceled:
    action: send
    channel:
      $ref: '#/channels/payment.instruction.canceled'
  publishPaymentInstructionLedgerPosted:
    action: send
    channel:
      $ref: '#/channels/payment.instruction.ledger-posted'
  publishPaymentInstructionSettled:
    action: send
    channel:
      $ref: '#/channels/payment.instruction.settled'
  publishPaymentInstructionFailed:
    action: send
    channel:
      $ref: '#/channels/payment.instruction.failed'
  publishPaymentInstructionRetryScheduled:
    action: send
    channel:
      $ref: '#/channels/payment.instruction.retry.scheduled'
  publishPaymentInstructionDeadLettered:
    action: send
    channel:
      $ref: '#/channels/payment.instruction.dead-lettered'
  publishPaymentAutopayExecutionCreated:
    action: send
    channel:
      $ref: '#/channels/payment.autopay.execution.created'
  publishNotificationDeliveryRequested:
    action: send
    channel:
      $ref: '#/channels/notification.delivery.requested'
  publishNotificationDeliveryAttempted:
    action: send
    channel:
      $ref: '#/channels/notification.delivery.attempted'
  publishNotificationDeliveryDelivered:
    action: send
    channel:
      $ref: '#/channels/notification.delivery.delivered'
  publishNotificationDeliveryFailed:
    action: send
    channel:
      $ref: '#/channels/notification.delivery.failed'
  publishNotificationDeliveryDeadLettered:
    action: send
    channel:
      $ref: '#/channels/notification.delivery.dead-lettered'
  publishReportArtifactGenerated:
    action: send
    channel:
      $ref: '#/channels/report.artifact.generated'
  publishReportArtifactExported:
    action: send
    channel:
      $ref: '#/channels/report.artifact.exported'
  publishReportRetentionSweepCompleted:
    action: send
    channel:
      $ref: '#/channels/report.retention-sweep.completed'
