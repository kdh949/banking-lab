apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.ingress.tlsSecretName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: banking-lab
    banking-lab/synthetic-only: {{ .Values.syntheticOnly | quote }}
    banking-lab/secret-purpose: ingress-tls-placeholder
type: kubernetes.io/tls
stringData:
  tls.crt: "replace-with-local-synthetic-tls-certificate-pem"
  tls.key: "replace-with-local-synthetic-tls-private-key-pem"
