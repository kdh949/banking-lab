apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: banking-lab
    banking-lab/synthetic-only: {{ .Values.syntheticOnly | quote }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.appHost }}
        - {{ .Values.ingress.authHost }}
        - {{ .Values.ingress.reportingHost }}
        - {{ .Values.ingress.paymentHost }}
        - {{ .Values.ingress.notificationHost }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.appHost }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-core-banking
                port:
                  number: {{ .Values.coreBanking.port }}
    - host: {{ .Values.ingress.authHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-keycloak
                port:
                  number: 8080
    - host: {{ .Values.ingress.reportingHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-reporting-service
                port:
                  number: {{ .Values.reportingService.port }}
    - host: {{ .Values.ingress.paymentHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-payment-service
                port:
                  number: {{ .Values.paymentService.port }}
    - host: {{ .Values.ingress.notificationHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-notification-service
                port:
                  number: {{ .Values.notificationService.port }}
