apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: banking-lab
data:
  BANKING_LAB_SYNTHETIC_ONLY: {{ .Values.syntheticOnly | quote }}
  BANKING_LAB_TEMPORAL_TARGET: {{ .Values.temporal.target | quote }}
  BANKING_LAB_TEMPORAL_TASK_QUEUE: "banking-case-workflows"
  BANKING_LAB_OUTBOX_BOOTSTRAP_SERVERS: {{ .Values.outbox.bootstrapServers | quote }}
  BANKING_LAB_OUTBOX_TOPIC: {{ .Values.outbox.topic | quote }}
  BANKING_LAB_SECURITY_ENABLED: "false"
  BANKING_LAB_SECURITY_SIMULATOR_TOKENS_ENABLED: "true"
