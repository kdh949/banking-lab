apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-core-banking
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: banking-lab
    app.kubernetes.io/name: {{ .Release.Name }}-core-banking
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-core-banking
  ports:
    - name: http
      port: {{ .Values.coreBanking.port }}
      targetPort: http
