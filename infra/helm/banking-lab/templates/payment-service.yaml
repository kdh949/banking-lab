apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-payment-service
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: banking-lab
    app.kubernetes.io/name: {{ .Release.Name }}-payment-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-payment-service
  ports:
    - name: http
      port: {{ .Values.paymentService.port }}
      targetPort: http
