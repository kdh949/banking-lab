apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: banking-lab
    banking-lab/synthetic-only: {{ .Values.syntheticOnly | quote }}
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: {{ .Values.postgres.username | quote }}
  SPRING_DATASOURCE_PASSWORD: "replace-with-local-synthetic-password"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://{{ .Release.Name }}-postgres:5432/{{ .Values.postgres.database }}"
  PAYMENT_CORE_BANKING_SERVICE_TOKEN: "replace-with-local-synthetic-payment-service-token"
