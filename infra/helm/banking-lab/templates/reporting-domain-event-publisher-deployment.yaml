apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-reporting-domain-event-publisher
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: banking-lab
    app.kubernetes.io/name: {{ .Release.Name }}-reporting-domain-event-publisher
spec:
  replicas: {{ .Values.reportingService.domainEventPublisherReplicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-reporting-domain-event-publisher
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: banking-lab
        app.kubernetes.io/name: {{ .Release.Name }}-reporting-domain-event-publisher
    spec:
      containers:
        - name: reporting-domain-event-publisher
          image: {{ .Values.reportingService.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.reportingService.port }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secret
          env:
            - name: PORT
              value: {{ .Values.reportingService.port | quote }}
            - name: BANKING_LAB_SYNTHETIC_ONLY
              value: {{ .Values.syntheticOnly | quote }}
            - name: BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_BOOTSTRAP_SERVERS
              value: {{ .Values.reportingService.domainEventPublisherBootstrapServers | quote }}
            - name: BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_TOPIC
              value: {{ .Values.reportingService.domainEventPublisherTopic | quote }}
            - name: BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_ENABLED
              value: "true"
            - name: BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_CLIENT_ID
              value: {{ .Values.reportingService.domainEventPublisherClientId | quote }}
            - name: BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_BATCH_SIZE
              value: "100"
            - name: BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_POLL_INTERVAL_MILLIS
              value: "1000"
            - name: BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_TIMEOUT_MILLIS
              value: "5000"
            - name: BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_DEAD_LETTER_THRESHOLD
              value: {{ .Values.reportingService.domainEventPublisherDeadLetterThreshold | quote }}
            - name: BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_RETRY_DELAY_SECONDS
              value: {{ .Values.reportingService.domainEventPublisherRetryDelaySeconds | quote }}
            - name: BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_EVENT_TYPES
              value: {{ .Values.reportingService.domainEventPublisherEventTypes | quote }}
            - name: BANKING_LAB_OTEL_SERVICE_NAME
              value: "banking-lab-reporting-domain-event-publisher"
            - name: BANKING_LAB_SECURITY_AUDIENCE
              value: {{ .Values.reportingService.securityAudience | quote }}
            - name: BANKING_LAB_REPORTING_DATABASE_URL
              value: "jdbc:postgresql://{{ .Release.Name }}-postgres:5432/{{ .Values.postgres.database }}"
            - name: BANKING_LAB_REPORTING_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: SPRING_DATASOURCE_USERNAME
            - name: BANKING_LAB_REPORTING_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: SPRING_DATASOURCE_PASSWORD
            - name: SPRING_FLYWAY_TABLE
              value: "reporting_flyway_schema_history"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: {{ .Values.reportingService.workerResources.requests.cpu | quote }}
              memory: {{ .Values.reportingService.workerResources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.reportingService.workerResources.limits.cpu | quote }}
              memory: {{ .Values.reportingService.workerResources.limits.memory | quote }}
