apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redpanda
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: banking-lab
    app.kubernetes.io/name: {{ .Release.Name }}-redpanda
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-redpanda
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: banking-lab
        app.kubernetes.io/name: {{ .Release.Name }}-redpanda
    spec:
      containers:
        - name: redpanda
          image: {{ .Values.redpanda.image | quote }}
          args:
            - redpanda
            - start
            - --overprovisioned
            - --smp
            - "1"
            - --memory
            - {{ .Values.redpanda.memory | quote }}
            - --reserve-memory
            - 0M
            - --node-id
            - "0"
            - --check=false
            - --kafka-addr
            - INTERNAL://0.0.0.0:{{ .Values.redpanda.kafkaPort }}
            - --advertise-kafka-addr
            - INTERNAL://{{ .Release.Name }}-redpanda:{{ .Values.redpanda.kafkaPort }}
          ports:
            - containerPort: {{ .Values.redpanda.kafkaPort }}
              name: kafka
            - containerPort: {{ .Values.redpanda.adminPort }}
              name: admin
          readinessProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redpanda
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: banking-lab
    app.kubernetes.io/name: {{ .Release.Name }}-redpanda
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-redpanda
  ports:
    - name: kafka
      port: {{ .Values.redpanda.kafkaPort }}
      targetPort: kafka
    - name: admin
      port: {{ .Values.redpanda.adminPort }}
      targetPort: admin
