apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-temporal-worker
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: banking-lab
    app.kubernetes.io/name: {{ .Release.Name }}-temporal-worker
spec:
  replicas: {{ .Values.temporalWorker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-temporal-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: banking-lab
        app.kubernetes.io/name: {{ .Release.Name }}-temporal-worker
    spec:
      containers:
        - name: temporal-worker
          image: {{ .Values.temporalWorker.image | quote }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secret
          env:
            - name: BANKING_LAB_SYNTHETIC_ONLY
              value: {{ .Values.syntheticOnly | quote }}
            - name: BANKING_LAB_TEMPORAL_WORKER_ENABLED
              value: "true"
            - name: BANKING_LAB_OTEL_SERVICE_NAME
              value: "banking-lab-core-banking-temporal-worker"
          resources:
            requests:
              cpu: {{ .Values.temporalWorker.resources.requests.cpu | quote }}
              memory: {{ .Values.temporalWorker.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.temporalWorker.resources.limits.cpu | quote }}
              memory: {{ .Values.temporalWorker.resources.limits.memory | quote }}
