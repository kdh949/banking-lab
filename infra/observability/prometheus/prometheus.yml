global:
  scrape_interval: 15s

scrape_configs:
  - job_name: core-banking
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - banking-lab:8080
          - host.docker.internal:8081
  - job_name: redpanda
    static_configs:
      - targets:
          - redpanda:9644
