apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: banking-lab
  labels:
    app.kubernetes.io/part-of: banking-lab
    app.kubernetes.io/name: temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: banking-lab
        app.kubernetes.io/name: temporal
    spec:
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.26
          ports:
            - containerPort: 7233
              name: grpc
          env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_SEEDS
              value: postgres
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: banking-lab-secret
                  key: SPRING_DATASOURCE_USERNAME
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: banking-lab-secret
                  key: SPRING_DATASOURCE_PASSWORD
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 45
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: banking-lab
  labels:
    app.kubernetes.io/part-of: banking-lab
    app.kubernetes.io/name: temporal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: temporal
  ports:
    - name: grpc
      port: 7233
      targetPort: grpc
