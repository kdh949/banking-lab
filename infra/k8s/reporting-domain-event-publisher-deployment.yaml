apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-domain-event-publisher
  namespace: banking-lab
  labels:
    app.kubernetes.io/part-of: banking-lab
    app.kubernetes.io/name: reporting-domain-event-publisher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: reporting-domain-event-publisher
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: banking-lab
        app.kubernetes.io/name: reporting-domain-event-publisher
    spec:
      containers:
        - name: reporting-domain-event-publisher
          image: banking-lab/reporting-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
              name: http
          envFrom:
            - configMapRef:
                name: banking-lab-config
            - secretRef:
                name: banking-lab-secret
          env:
            - name: PORT
              value: "8090"
            - name: BANKING_LAB_SYNTHETIC_ONLY
              value: "true"
            - name: BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_BOOTSTRAP_SERVERS
              value: "redpanda:9092"
            - name: BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_TOPIC
              value: "banking.lab.reporting-events"
            - name: BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_ENABLED
              value: "true"
            - name: BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_CLIENT_ID
              value: "reporting-k8s-domain-event-publisher"
            - name: BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_BATCH_SIZE
              value: "100"
            - name: BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_POLL_INTERVAL_MILLIS
              value: "1000"
            - name: BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_TIMEOUT_MILLIS
              value: "5000"
            - name: BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_DEAD_LETTER_THRESHOLD
              value: "3"
            - name: BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_RETRY_DELAY_SECONDS
              value: "60"
            - name: BANKING_LAB_REPORTING_DOMAIN_EVENT_PUBLISHER_EVENT_TYPES
              value: "ReportArtifactGenerated,ReportArtifactExported,ReportRetentionSweepCompleted"
            - name: BANKING_LAB_OTEL_SERVICE_NAME
              value: "banking-lab-reporting-domain-event-publisher"
            - name: BANKING_LAB_SECURITY_AUDIENCE
              value: "reporting-service-api"
            - name: BANKING_LAB_REPORTING_DATABASE_URL
              value: "jdbc:postgresql://postgres:5432/banking_lab"
            - name: BANKING_LAB_REPORTING_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: banking-lab-secret
                  key: SPRING_DATASOURCE_USERNAME
            - name: BANKING_LAB_REPORTING_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: banking-lab-secret
                  key: SPRING_DATASOURCE_PASSWORD
            - name: SPRING_FLYWAY_TABLE
              value: "reporting_flyway_schema_history"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
