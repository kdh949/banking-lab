apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: banking-lab
  labels:
    app.kubernetes.io/part-of: banking-lab
    app.kubernetes.io/name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: banking-lab
        app.kubernetes.io/name: notification-service
    spec:
      containers:
        - name: notification-service
          image: banking-lab/notification-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8089
              name: http
          envFrom:
            - configMapRef:
                name: banking-lab-config
            - secretRef:
                name: banking-lab-secret
          env:
            - name: PORT
              value: "8089"
            - name: BANKING_LAB_SYNTHETIC_ONLY
              value: "true"
            - name: BANKING_LAB_NOTIFICATION_SERVICE_REAL_PROVIDER_ENABLED
              value: "false"
            - name: BANKING_LAB_NOTIFICATION_EVENT_CONSUMER_BOOTSTRAP_SERVERS
              value: "redpanda:9092"
            - name: BANKING_LAB_NOTIFICATION_EVENT_CONSUMER_TOPIC
              value: "banking.lab.domain-events"
            - name: BANKING_LAB_NOTIFICATION_EVENT_CONSUMER_ENABLED
              value: "false"
            - name: BANKING_LAB_OTEL_SERVICE_NAME
              value: "banking-lab-notification-service"
            - name: BANKING_LAB_SECURITY_AUDIENCE
              value: "notification-service-api"
            - name: BANKING_LAB_NOTIFICATION_DATABASE_URL
              value: "jdbc:postgresql://postgres:5432/banking_lab"
            - name: BANKING_LAB_NOTIFICATION_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: banking-lab-secret
                  key: SPRING_DATASOURCE_USERNAME
            - name: BANKING_LAB_NOTIFICATION_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: banking-lab-secret
                  key: SPRING_DATASOURCE_PASSWORD
            - name: SPRING_FLYWAY_TABLE
              value: "notification_flyway_schema_history"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
