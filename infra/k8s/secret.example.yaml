apiVersion: v1
kind: Secret
metadata:
  name: banking-lab-secret
  namespace: banking-lab
  labels:
    app.kubernetes.io/part-of: banking-lab
    banking-lab/synthetic-only: "true"
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "banking_lab"
  SPRING_DATASOURCE_PASSWORD: "replace-with-local-synthetic-password"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/banking_lab"
  PAYMENT_CORE_BANKING_SERVICE_TOKEN: "replace-with-local-synthetic-payment-service-token"
  KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
  KC_BOOTSTRAP_ADMIN_PASSWORD: "replace-with-local-synthetic-keycloak-password"
