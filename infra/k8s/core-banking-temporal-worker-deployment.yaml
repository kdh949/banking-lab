apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-banking-temporal-worker
  namespace: banking-lab
  labels:
    app.kubernetes.io/part-of: banking-lab
    app.kubernetes.io/name: core-banking-temporal-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: core-banking-temporal-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: banking-lab
        app.kubernetes.io/name: core-banking-temporal-worker
    spec:
      containers:
        - name: temporal-worker
          image: banking-lab/core-banking-service:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: banking-lab-config
            - secretRef:
                name: banking-lab-secret
          env:
            - name: BANKING_LAB_SYNTHETIC_ONLY
              value: "true"
            - name: BANKING_LAB_TEMPORAL_WORKER_ENABLED
              value: "true"
            - name: BANKING_LAB_OTEL_SERVICE_NAME
              value: "banking-lab-core-banking-temporal-worker"
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
