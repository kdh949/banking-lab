apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: banking-lab
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: banking-lab
spec:
  project: default
  source:
    repoURL: https://example.invalid/synthetic/banking-lab.git
    targetRevision: HEAD
    path: infra/helm/banking-lab
  destination:
    server: https://kubernetes.default.svc
    namespace: banking-lab
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
