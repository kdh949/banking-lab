name: Refresh PR 95 package lock

on:
  push:
    branches:
      - agent/payment-customer-ownership
    paths:
      - .github/workflows/refresh-pr95-package-lock.yml
      - package.json
      - package-lock.json

permissions:
  contents: write

jobs:
  refresh-package-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/payment-customer-ownership
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Pin patched transitive dependencies
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.overrides = {
            next: {
              postcss: '8.5.22',
              sharp: '0.35.3'
            },
            postcss: '8.5.22',
            sharp: '0.35.3'
          }
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`)
          NODE
          npm update next postcss sharp --package-lock-only --ignore-scripts
      - name: Verify audit and commit refreshed lockfile
        shell: bash
        run: |
          npm audit --audit-level=high
          if git diff --quiet -- package.json package-lock.json; then
            echo "dependency metadata is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: 보안 패치 의존성 잠금 갱신"
          git push origin HEAD:agent/payment-customer-ownership
