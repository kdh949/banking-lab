name: Fix PR 95 dependency lock regression test

on:
  push:
    branches:
      - agent/payment-customer-ownership
    paths:
      - .github/workflows/fix-pr95-next-lock-test.yml

permissions:
  contents: write

jobs:
  update-regression-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/payment-customer-ownership
          fetch-depth: 0
      - name: Align security dependency assertions with patched lockfile
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('tests/nextScaffold.test.mjs')
          text = path.read_text()
          old = '''test("Next dependency lock uses the postcss security override", async () => {
            const rootPackage = JSON.parse(await readFile("package.json", "utf8"));
            const lock = JSON.parse(await readFile("package-lock.json", "utf8"));

            assert.equal(rootPackage.overrides.postcss, "8.5.10");
            assert.equal(rootPackage.overrides.next.postcss, "8.5.10");
            assert.equal(lock.packages["node_modules/postcss"].version, "8.5.10");
            assert.equal(lock.packages["node_modules/next"].dependencies.postcss, "8.5.10");
          });'''
          new = '''test("Next dependency lock uses patched framework and image dependencies", async () => {
            const rootPackage = JSON.parse(await readFile("package.json", "utf8"));
            const lock = JSON.parse(await readFile("package-lock.json", "utf8"));

            assert.equal(rootPackage.overrides.postcss, "8.5.22");
            assert.equal(rootPackage.overrides.next.postcss, "8.5.22");
            assert.equal(rootPackage.overrides.sharp, "0.35.3");
            assert.equal(rootPackage.overrides.next.sharp, "0.35.3");
            assert.equal(lock.packages["node_modules/postcss"].version, "8.5.22");
            assert.equal(lock.packages["node_modules/sharp"].version, "0.35.3");
            assert.equal(lock.packages["node_modules/next"].version, "16.2.12");
          });'''
          if old not in text:
              raise SystemExit('expected stale dependency assertion block was not found')
          path.write_text(text.replace(old, new))
          PY
          node --test tests/nextScaffold.test.mjs
          rm .github/workflows/fix-pr95-next-lock-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/nextScaffold.test.mjs .github/workflows/fix-pr95-next-lock-test.yml
          git commit -m "test: 보안 패치 의존성 잠금 검증 갱신"
          git push origin HEAD:agent/payment-customer-ownership
