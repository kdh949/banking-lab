name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-and-manifests:
    name: Node reference and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate:manifests
      - run: npm run packages:typecheck
      - run: npm run scripts:typecheck
      - run: npm run ci:check-workflow

  next-builds:
    name: Next.js channel builds
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - customer-web
          - staff-terminal
          - complaint-portal
          - ops-console
          - audit-console
          - fds-aml-console
          - admin-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run next:${{ matrix.app }}:typecheck
      - run: npm run next:${{ matrix.app }}:build

  backend-core-banking:
    name: Kotlin Spring core banking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: scripts/run-core-banking-tests.sh :services:core-banking:test
      - run: scripts/run-core-banking-tests.sh :services:core-banking:integrationTest

  backend-payment-service:
    name: Kotlin Spring payment service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: scripts/run-core-banking-tests.sh :services:payment-service:test
      - run: scripts/run-core-banking-tests.sh :services:payment-service:integrationTest

  backend-notification-service:
    name: Kotlin Spring notification service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: scripts/run-core-banking-tests.sh :services:notification-service:test
      - run: scripts/run-core-banking-tests.sh :services:notification-service:integrationTest

  backend-reporting-service:
    name: Kotlin Spring reporting service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: scripts/run-core-banking-tests.sh :services:reporting-service:test
      - run: scripts/run-core-banking-tests.sh :services:reporting-service:integrationTest

  backend-all-gradle:
    name: Kotlin Spring all services unit aggregate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: scripts/run-core-banking-tests.sh :services:core-banking:test :services:payment-service:test :services:notification-service:test :services:reporting-service:test

  platform-validation:
    name: Platform structural validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run platform:validate

  contracts-validation:
    name: Contract structural validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/springScaffold.test.mjs tests/nextScaffold.test.mjs tests/stackRetirementAreaAudit.test.mjs

  compose-platform-config:
    name: Docker Compose platform config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose --profile platform config

  playwright-manifest-e2e:
    name: Playwright manifest E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  security-evidence:
    name: Security evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run security:evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-evidence
          path: docs/test-evidence/generated/

  formal-model:
    name: Formal ledger model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run formal:ledger
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formal-ledger-model
          path: |
            docs/test-evidence/generated/formal-ledger-model.json
            docs/test-evidence/generated/formal-ledger-tlc-result.json
