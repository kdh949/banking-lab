name: PR98 core ledger evidence diagnostic

on:
  push:
    branches:
      - agent/payment-three-way-reconciliation

permissions:
  contents: read

jobs:
  targeted-core-ledger-evidence:
    name: Targeted core ledger evidence integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: >-
          scripts/run-core-banking-tests.sh
          :services:core-banking:integrationTest
          --tests lab.banking.core.ledger.evidence.PaymentLedgerEvidenceIntegrationTest
          --stacktrace
          --info
