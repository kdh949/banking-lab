name: Implement payment settlement foundation

on:
  push:
    branches:
      - agent/payment-settlement-import-batches
    paths:
      - .github/workflows/implement-payment-settlement-foundation.yml
      - scripts/apply-payment-settlement-contracts.py
      - scripts/fixtures/payment-settlement-openapi-paths.yml
      - scripts/fixtures/payment-settlement-openapi-schemas.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/implement-payment-settlement-foundation.yml
      - scripts/apply-payment-settlement-contracts.py
      - scripts/fixtures/payment-settlement-openapi-paths.yml
      - scripts/fixtures/payment-settlement-openapi-schemas.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/payment-settlement-import-batches
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply settlement OpenAPI contracts
        run: python3 scripts/apply-payment-settlement-contracts.py
      - name: Install Node dependencies
        run: npm ci
      - name: Verify repository and contracts
        run: |
          npm run contracts:diff-openapi
          npm run contracts:runtime-evidence
          npm run contracts:validate-runtime-events
          npm test
          npm run contracts:lint
          npm run contracts:check-client
          npm run contracts:check-events
          npm run packages:typecheck
          npm run scripts:typecheck
      - name: Verify payment-service behavior
        run: scripts/run-core-banking-tests.sh :services:payment-service:test :services:payment-service:integrationTest
      - name: Publish verified implementation
        shell: bash
        run: |
          git diff --check
          git checkout -- \
            docs/test-evidence/generated/aml-model-card.json \
            docs/test-evidence/generated/aml-regulatory-report.json \
            docs/test-evidence/generated/aml-str-report-summary.json \
            docs/test-evidence/generated/synthetic-str-report.json || true
          rm .github/workflows/implement-payment-settlement-foundation.yml
          rm scripts/apply-payment-settlement-contracts.py
          rm scripts/fixtures/payment-settlement-openapi-paths.yml
          rm scripts/fixtures/payment-settlement-openapi-schemas.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 독립 외부 정산 import 및 batch foundation"
          git push origin HEAD:agent/payment-settlement-import-batches
